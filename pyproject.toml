[project]
name = "nhcogs"
version = "0.0.0"
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    ".worktrees",
    "local-data",
    "tests/test_detection_pipeline.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RET", "ASYNC", "PL", "TRY"]
ignore = ["E501", "PLR0913", "TRY003"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["PLR2004", "SIM117"]

[tool.mypy]
files = ["Honeypot", "NHMisc"]
python_version = "3.10"
exclude = "(^|/)(\\.worktrees|local-data)/"
ignore_missing_imports = true
warn_unused_configs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = false
