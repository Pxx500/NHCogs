name: CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install quality tools
        run: python -m pip install ruff mypy Pillow matplotlib aiohttp==3.9.5 pytest pytest-xdist
      - name: Ruff
        run: ruff check .
      # Typing is a separate phase. mypy still reports errors across both cogs,
      # including NHMisc, which the Honeypot refactor plan never scoped, so this
      # step stays advisory. Ruff above is the hard gate; see round D in
      # local-data/Honeypot/docs/phase6-plan.md.
      - name: Mypy
        continue-on-error: true
        run: mypy
      - name: Unit tests
        run: python -m pytest tests -q -n 4 --dist loadscope
